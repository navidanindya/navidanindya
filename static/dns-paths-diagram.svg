<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Before and after removing the DNS override</title>
<desc>Diagram showing that a leftover dns.setServers override was being blocked by Railway's network, and removing it let the app use Railway's own working DNS resolver.</desc>
<defs>
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Roboto+Mono:ital,wght@1,400;1,600&display=swap');
.head { font-family: 'Space Grotesk', Helvetica, Arial, sans-serif; font-weight: 600; }
.code { font-family: 'Roboto Mono', 'Courier New', monospace; font-style: italic; font-weight: 400; }
.code-strong { font-family: 'Roboto Mono', 'Courier New', monospace; font-style: italic; font-weight: 600; }
]]></style>
</defs>
<rect x="0" y="0" width="680" height="360" rx="16" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/>
<g>
  <text class="head" x="175" y="44" text-anchor="middle" font-size="14" fill="#712B13">BEFORE — override in code</text>
  <text class="head" x="485" y="44" text-anchor="middle" font-size="14" fill="#085041">AFTER — override removed</text>

  <rect x="40" y="68" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text class="head" x="175" y="86" text-anchor="middle" font-size="14" fill="#712B13">dns.setServers() override</text>
  <text class="code" x="175" y="104" text-anchor="middle" font-size="12" fill="#993C1D">added for a different setup</text>

  <rect x="350" y="68" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="head" x="485" y="86" text-anchor="middle" font-size="14" fill="#085041">No DNS override</text>
  <text class="code" x="485" y="104" text-anchor="middle" font-size="12" fill="#0F6E56">resolver left untouched</text>

  <line x1="175" y1="124" x2="175" y2="156" stroke="#993C1D" stroke-width="1.5"/>
  <polygon points="175,160 170,151 180,151" fill="#993C1D"/>
  <line x1="485" y1="124" x2="485" y2="156" stroke="#0F6E56" stroke-width="1.5"/>
  <polygon points="485,160 480,151 490,151" fill="#0F6E56"/>

  <rect x="40" y="160" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text class="head" x="175" y="178" text-anchor="middle" font-size="14" fill="#712B13">Railway blocks the call</text>
  <text class="code" x="175" y="196" text-anchor="middle" font-size="12" fill="#993C1D">outbound to 8.8.8.8 fails</text>

  <rect x="350" y="160" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="head" x="485" y="178" text-anchor="middle" font-size="14" fill="#085041">Railway's own DNS path</text>
  <text class="code" x="485" y="196" text-anchor="middle" font-size="12" fill="#0F6E56">handles the query fine</text>

  <line x1="175" y1="216" x2="175" y2="248" stroke="#993C1D" stroke-width="1.5"/>
  <polygon points="175,252 170,243 180,243" fill="#993C1D"/>
  <line x1="485" y1="216" x2="485" y2="248" stroke="#0F6E56" stroke-width="1.5"/>
  <polygon points="485,252 480,243 490,243" fill="#0F6E56"/>

  <rect x="40" y="252" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text class="head" x="175" y="270" text-anchor="middle" font-size="14" fill="#712B13">querySrv ETIMEOUT</text>
  <text class="code-strong" x="175" y="288" text-anchor="middle" font-size="12" fill="#993C1D">healthcheck fails</text>

  <rect x="350" y="252" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text class="head" x="485" y="270" text-anchor="middle" font-size="14" fill="#085041">Connects successfully</text>
  <text class="code-strong" x="485" y="288" text-anchor="middle" font-size="12" fill="#0F6E56">healthcheck passes</text>

  <text class="code" x="330" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">One leftover line, added for a different environment, caused the outage</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="{{height}}" viewBox="0 0 1200 {{height}}" role="img" aria-labelledby="title">
  <title id="title">{{title}}</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <pattern id="dots" x="-1" y="7" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.2" fill="#39434f"/>
    </pattern>
  </defs>
  <rect width="1200" height="{{height}}" fill="url(#background)"/>
  <rect x="34" y="34" width="1132" height="{{frameHeight}}" rx="19" fill="none" stroke="#45505c"/>
  <path d="M70 72h22" fill="none" stroke="#f5b85a" stroke-width="6" stroke-linecap="round"/>
  <text x="107" y="81" fill="#f5b85a" font-family="Roboto Mono" font-size="22" font-weight="600" xml:space="preserve">{{label}}</text>
  <text x="1128" y="80" text-anchor="end" fill="#c4cbd5" font-family="Roboto Mono" font-size="20">navidanindya.info</text>
  <!-- The title and motif use the same layout in every share card. -->
  <g transform="translate(0 {{middleOffset}})">
    <rect x="846" y="134" width="288" height="377" fill="url(#dots)"/>
    {{art}}
    <text fill="#fffaf0" font-family="Space Grotesk" font-size="{{titleSize}}" font-weight="600">{{titleLines}}</text>
    <text fill="#c4cbd5" font-family="Roboto Mono" font-size="23">{{descriptionLines}}</text>
  </g>
  <g transform="translate(0 {{footerOffset}})">
    <path d="M70 515h1060" stroke="#485361"/>
    <rect x="72" y="533" width="44" height="44" rx="5" fill="#18212f" stroke="#576373"/>
    <image x="74" y="535" width="40" height="40" xlink:href="{{logo}}"/>
    <text x="131" y="565" fill="#fffaf0" font-family="Roboto Mono" font-size="23" font-weight="600">Navid Anindya</text>
    <text x="1128" y="564" text-anchor="end" fill="#c4cbd5" font-family="Roboto Mono" font-size="20">{{footer}}</text>
  </g>
</svg>

name: CI

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  verify:
    # Build feature PRs once before they enter the promotion branches.
    if: github.head_ref != 'staging' && github.head_ref != 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --tag site-ci .
      - run: |
          docker run --rm -e CI=true site-ci sh -ec '
            npm run lint
            npm run generate
            npx --no-install wrangler d1 migrations apply VIEWS_DB --local --config wrangler.local.toml
          '
